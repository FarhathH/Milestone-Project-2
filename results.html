<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!--Bootstrap CSS Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
        
        <!--My own css stylesheet-->
        <link rel="stylesheet" href="assets/css/style.css">
        <title>Amy Rose Dress-up Game</title>
    </head>
    <body>

        
        

        <!--Container grid for layout of dress up screen-->
        <section class="container" >
            <div class="row">
                <div class=" col-sm-12 col-md-12 col-lg-6">
                    <div class="contain">
                        <h1 class="display-1">Looking good, Amy!</h1>
                    </div>
                </div>
                <div class="row col-sm-12 col-md-12 col-lg-6 mx-auto">
                  <div class="contain">
                    <p>Amy Rose in her chosen outfit</p>
                  </div>
                </div>
            </div>
            <div class="row mx-auto">
                <div class="contain"><button id="play-again">Play again</button></div>
                <div class="contain mt-3"><button id="truly-finished">Main Menu</button></div>
            </div>
        </section>
        
        
        <!--Bootstrap js link-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous"></script>
        <!--jQuery CDN link-->
        <script src="https://code.jquery.com/jquery-3.7.1.js" 
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" 
        crossorigin="anonymous"></script>

        <!--my own js script for implementing the jQuery library-->
        <script src="js/actionscript.js"></script>
    </body>
</html>
